packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  esbuild: true
  unrs-resolver: true
  vue-demi: true

# @nestjs/platform-fastify@11.1.28 hard-pins find-my-way@9.6.0 (vulnerable to
# GHSA-c96f-x56v-gq3h, DDoS via HTTP/2) with no newer stable release yet —
# force the already-patched version fastify itself resolves to elsewhere in
# the same tree.
overrides:
  find-my-way: '>=9.6.1'
  # @nestjs/platform-fastify@11.1.28 also hard-pins an exact fastify@5.10.0,
  # separate from apps/api's own ^5.11.0 — two installed copies means two
  # structurally distinct FastifyInstance types, which broke @fastify/helmet's
  # plugin typing. Force a single resolved fastify across the tree.
  fastify: '^5.11.0'
  # postcss@8.5.25 (pulled in by @vue/compiler-sfc, several levels under
  # apps/web's vue dependency) hard-pins nanoid@3.3.16, vulnerable to
  # GHSA-2v37-7h3g-55p8 (custom generators can loop indefinitely when size is
  # 0). nanoid isn't a direct dependency anywhere in the repo — force the
  # patched version across the tree.
  nanoid: '>=3.3.17'
