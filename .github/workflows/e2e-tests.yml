name: E2E tests (reusable)

# Shared by ci.yml (every PR/push — gate, artifact-only) and deploy.yml
# (push to main — additionally bundles the Allure report onto GitHub Pages).
# Kept as a single reusable workflow so both callers run the exact same
# Postgres+api+Playwright steps instead of two copies drifting apart.
on:
  workflow_call:

jobs:
  e2e:
    name: Playwright e2e (apps/web + apps/api + Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hexoflat
          POSTGRES_PASSWORD: hexoflat
          POSTGRES_DB: hexoflat
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U hexoflat -d hexoflat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Java (for the Allure report CLI)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Playwright browsers
        run: pnpm --filter @hexoflat/playwright exec playwright install --with-deps chromium

      - name: Build apps/api and packages/engine
        run: pnpm turbo run build --filter=@hexoflat/api

      - name: Push DB schema
        run: pnpm --filter @hexoflat/api db:push

      - name: Start apps/api
        run: nohup pnpm --filter @hexoflat/api start > /tmp/api.log 2>&1 &

      - name: Wait for apps/api health check
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "apps/api is up"
              exit 0
            fi
            sleep 1
          done
          echo "apps/api never became healthy — logs:"
          cat /tmp/api.log
          exit 1

      - name: Run Playwright e2e
        run: pnpm --filter @hexoflat/playwright test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/playwright/playwright-report/
          retention-days: 7

      - name: Generate Allure report
        if: always()
        run: pnpm --filter @hexoflat/playwright run report:allure:generate

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: apps/playwright/allure-report/
          retention-days: 7

      # On a PR/branch run there's no fresh Pages deploy to link to, but the
      # previous main-branch report is still live at a fixed, predictable
      # URL — worth surfacing here so "no live link on PRs" doesn't read as
      # "no live link at all". deploy.yml overwrites this same path with a
      # report matching this exact run whenever it runs on main.
      - name: Link latest deployed Allure report in the job summary
        if: always()
        run: |
          echo "### Allure report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- This run's full report: see the \`allure-report\` artifact above (download + open \`index.html\`)." >> "$GITHUB_STEP_SUMMARY"
          echo "- Latest **main**-branch report (live, updated on every push to main): https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/e2e-report/" >> "$GITHUB_STEP_SUMMARY"
