name: E2E tests (reusable)

# Called once, as the last job in ci.yml, after every cheaper check has
# passed. Kept as its own reusable workflow file (rather than inlined) so the
# Postgres+api+Playwright steps stay easy to read on their own.
on:
  workflow_call:

jobs:
  e2e:
    name: Playwright e2e (apps/web + apps/api + Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hexoflat
          POSTGRES_PASSWORD: hexoflat
          POSTGRES_DB: hexoflat
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U hexoflat -d hexoflat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Java (for the Allure report CLI)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Playwright browsers
        run: pnpm --filter @hexoflat/playwright exec playwright install --with-deps chromium

      - name: Build apps/api and packages/engine
        run: pnpm turbo run build --filter=@hexoflat/api

      - name: Push DB schema
        run: pnpm --filter @hexoflat/api db:push

      - name: Start apps/api
        run: nohup pnpm --filter @hexoflat/api start > /tmp/api.log 2>&1 &

      - name: Wait for apps/api health check
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "apps/api is up"
              exit 0
            fi
            sleep 1
          done
          echo "apps/api never became healthy — logs:"
          cat /tmp/api.log
          exit 1

      - name: Run Playwright e2e
        run: pnpm --filter @hexoflat/playwright test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/playwright/playwright-report/
          retention-days: 7

      # Allure only draws its trend graphs when the *previous* run's history/
      # folder is present in allure-results before generation. Without this the
      # report is rebuilt from scratch every time and every trend chart is
      # empty. The live Pages deployment is the only durable store we have, so
      # the previous report's history is pulled straight back out of it.
      #
      # continue-on-error + `|| true`: on the very first run (or any run before
      # Pages has ever been published) these URLs 404, and that must not fail
      # the job.
      - name: Fetch previous Allure history (for the trend graphs)
        if: always()
        continue-on-error: true
        run: |
          BASE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/e2e-report"
          mkdir -p apps/playwright/allure-results/history
          for f in history.json duration-trend.json retry-trend.json categories-trend.json; do
            curl -sfL "$BASE/history/$f" -o "apps/playwright/allure-results/history/$f" || true
          done

      - name: Generate Allure report
        if: always()
        run: pnpm --filter @hexoflat/playwright run report:allure:generate

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: apps/playwright/allure-report/
          retention-days: 7

      # ci.yml's `deploy` job publishes this same run's report to the fixed
      # Pages URL below (on every PR as well as on the trunk branches — see
      # the note at the top of ci.yml), so the link is live a minute or two
      # after this job finishes. The artifact stays as the offline fallback
      # for runs where the deploy job was skipped, e.g. fork PRs.
      - name: Link the deployed Allure report in the job summary
        if: always()
        run: |
          echo "### Allure report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Live report for this run (published once the Deploy job finishes): https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/e2e-report/" >> "$GITHUB_STEP_SUMMARY"
          echo "- Offline copy: the \`allure-report\` artifact above (download + open \`index.html\`)." >> "$GITHUB_STEP_SUMMARY"
