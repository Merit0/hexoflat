name: Deploy to GitHub Pages

# Deliberately deploys the whole Pages site (apps/web/dist + the Allure report
# at /e2e-report) from every PR as well as from the trunk branches, so a PR
# always has a live report link rather than a zip artifact.
#
# The trade-off was made knowingly: the game published at the Pages root is
# whatever the most recent successful deploy built, so between a PR deploy and
# the next trunk deploy the public site shows that PR's build. If that ever
# stops being acceptable, the fix is to publish only dist/e2e-report from PR
# runs and restore apps/web/dist from the last trunk deploy.
on:
  push:
    branches: [main, game-dev-vite]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  e2e:
    name: Playwright e2e
    uses: ./.github/workflows/e2e-tests.yml

  build:
    name: Build
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No lint/typecheck/test here: ci.yml already runs all three as their
      # own jobs on the exact same commit (every PR, every push to a trunk
      # branch). Repeating them only made every deploy slower.
      - name: Build
        env:
          GITHUB_PAGES: 'true'
        run: pnpm turbo run build

      # Bundled as a subpath of the same Pages site rather than a separate
      # Pages source — GitHub Pages only supports one source per repo, and
      # this one (Actions-deployed) is already spoken for by apps/web.
      # continue-on-error: the artifact may be missing if the e2e job above
      # failed before it could even generate/upload the report.
      - name: Download Allure report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: apps/web/dist/e2e-report

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    name: Deploy
    needs: build
    # `build` already runs on `if: always()` so the Allure report (complete
    # with failure videos/screenshots) exists even when `e2e` failed — but a
    # job's *default* `if` checks success() across the whole transitive
    # `needs` chain, not just its direct dependency, so without this
    # `!cancelled()` `deploy` would still be silently skipped on a red e2e
    # run and the report would never actually reach the live Pages URL.
    # `!cancelled()`, not bare `always()`: an explicit workflow cancellation
    # should still skip deploy, just not a failed job.
    #
    # A pull_request run from a fork gets a read-only GITHUB_TOKEN — no
    # `pages: write`, no OIDC id-token — so the deploy step below cannot
    # possibly succeed there. Skipping keeps fork PRs green instead of
    # failing on something the contributor cannot fix.
    if: |
      !cancelled() &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Link the Allure report in the job summary
        run: |
          echo "### Allure e2e report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deployment.outputs.page_url }}e2e-report/" >> "$GITHUB_STEP_SUMMARY"
