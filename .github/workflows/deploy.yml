name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  e2e:
    name: Playwright e2e
    uses: ./.github/workflows/e2e-tests.yml

  build:
    name: Build
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Test
        run: pnpm turbo run test

      - name: Build
        env:
          GITHUB_PAGES: 'true'
        run: pnpm turbo run build

      # Bundled as a subpath of the same Pages site rather than a separate
      # Pages source — GitHub Pages only supports one source per repo, and
      # this one (Actions-deployed) is already spoken for by apps/web.
      # continue-on-error: the artifact may be missing if the e2e job above
      # failed before it could even generate/upload the report.
      - name: Download Allure report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: apps/web/dist/e2e-report

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Link the Allure report in the job summary
        run: |
          echo "### Allure e2e report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deployment.outputs.page_url }}e2e-report/" >> "$GITHUB_STEP_SUMMARY"
